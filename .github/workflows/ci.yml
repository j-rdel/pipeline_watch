name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --dev
      - name: ruff check
        run: uv run ruff check src tests

  test:
    name: pytest (unit only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --dev
      - name: pytest (skip integration)
        run: uv run pytest -q -m "not integration"

  build:
    name: build wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install build backend
        run: uv sync --dev
      - name: build
        run: uv build --wheel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline_watch-wheel
          path: dist/*.whl
          retention-days: 7
